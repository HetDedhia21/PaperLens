services:
  db:
    image: pgvector/pgvector:pg18
    container_name: paperlens-db
    environment:
      POSTGRES_USER: paperlens
      POSTGRES_PASSWORD: paperlens
      POSTGRES_DB: paperlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: